<!DOCTYPE html>
<html>
<head><title>Discord Mock</title></head>
<body>
<h1>✅ Discord Webhook Recebido!</h1>
<pre id="payload"></pre>
<script>
    fetch(window.location.href)
        .then(r => r.json())
        .then(data => {
            document.getElementById('payload').textContent = JSON.stringify(data, null, 2);
        });
</script>
</body>
</html>
