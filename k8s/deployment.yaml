apiVersion: apps/v1
kind: Deployment
metadata:
  name: hookord
  labels:
    app: hookord
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hookord
  template:
    metadata:
      labels:
        app: hookord
    spec:
      containers:
      - name: hookord
        image: hookord:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: hookord-config
        - secretRef:
            name: hookord-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: hookord-service
spec:
  selector:
    app: hookord
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
