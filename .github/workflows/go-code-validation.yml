name: Go Code Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  format-and-lint:
    name: Format and Lint
    if: ${{ github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted_files=$(gofmt -s -l .)
          if [ -n "$unformatted_files" ]; then
            echo "The following files are not properly formatted:"
            echo "$unformatted_files"
            exit 1
          fi

      - name: Lint (go vet)
        run: go vet ./...
  tests:
    name: Run Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -v -race ./...
