name: PR Review on Validation

on:
  workflow_run:
    workflows:
      - Go Code Validation
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  review-pr:
    name: Review PR based on validation result
    if: ${{ github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Review PR (Approve or Request Changes)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              core.info("No pull request associated with this workflow run.");
              return;
            }

            const pullNumber = prs[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pr.state !== "open") {
              core.info(`PR #${pullNumber} is not open. Skipping review.`);
              return;
            }

            if (pr.draft) {
              core.info(`PR #${pullNumber} is in draft state (blocked). Skipping review.`);
              return;
            }

            const conclusion = context.payload.workflow_run.conclusion;

            if (conclusion === "failure") {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                event: "REQUEST_CHANGES",
                body: "A validação automática falhou (formatação/lint/testes). Corrija os pontos reportados no workflow e envie novos commits.",
              });
              core.info(`Requested changes on PR #${pullNumber}.`);
            } else if (conclusion === "success") {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                event: "APPROVE",
                body: "Todas as validações automáticas (formatação, lint e testes) passaram com sucesso! PR aprovada automaticamente.",
              });
              core.info(`Approved PR #${pullNumber}.`);
            }

