name: PR Request Changes on Validation Failure

on:
  workflow_run:
    workflows:
      - Go Code Validation
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  request-changes:
    name: Request changes when validation fails
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Request changes on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              core.info("No pull request associated with this workflow run.");
              return;
            }

            const pullNumber = prs[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pr.state !== "open") {
              core.info(`PR #${pullNumber} is not open. Skipping review.`);
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              event: "REQUEST_CHANGES",
              body: "A validação automática falhou (formatação/lint/testes). Corrija os pontos reportados no workflow e envie novos commits.",
            });
