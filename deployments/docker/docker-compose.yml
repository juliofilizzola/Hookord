services:
  hookord:
    build:
      context: ../../../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    environment:
      - TZ=America/Sao_Paulo
      - GHNOTIFY_LOGGING_LEVEL=debug
      - GHNOTIFY_GITHUB_WEBHOOK_SECRET=sha256=dev-secret-123
      - GHNOTIFY_DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  discord-mock:
    image: httpd:alpine
    ports:
      - "8081:80"
    volumes:
      - ./mock/discord.html:/usr/local/apache2/htdocs/index.html:ro
